name: Deploy to Cloudflare (chase-analytics.com)

# Deploys the dashboard to the Cloudflare PAGES project "mlbma-pipeline-b" (the one
# chase-analytics.com is attached to) on every push to master.
# Requires repo secrets CLOUDFLARE_API_TOKEN (with Pages:Edit) + CLOUDFLARE_ACCOUNT_ID.
#
# Verify the exact uploaded revision on the custom domain. A Git production
# deployment is a fallback when the direct upload has not reached the domain.

on:
  push:
    branches: [master]
  # The daily pipeline commits refreshed public artifacts using GITHUB_TOKEN, and
  # GitHub deliberately raises no `push` event for those commits - so every data
  # refresh landed on master and sat there undeployed until a human happened to
  # push something else. That is why the site served a 2026-09-14 MLB slate and a
  # week-2 NFL slate while master had both current. Deploy when the pipeline
  # finishes rather than waiting for an unrelated commit to carry it.
  # The CFB and MLB slate publishers commit the same way.
  workflow_run:
    workflows: ["Run MLBMA Pipeline", "Publish CFB Slate", "Publish MLB Slate", "Publish NFL Slate", "Publish NBA Slate", "Publish CBB Slate"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

jobs:
  quality-gate:
    # A pipeline that failed has nothing new worth shipping.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Enforce design and public-data contracts
        run: |
          python scripts/check_tokens.py
          python scripts/validate_public_fields.py
          node --check dashboard/matchup_card.js
          node --check dashboard/public_game_detail.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run public browser and responsive contracts
        run: |
          npx --yes wrangler@4.40.0 pages dev . --port 8765 >/tmp/chase-worker.log 2>&1 &
          for attempt in $(seq 1 45); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:8765/ >/dev/null || { cat /tmp/chase-worker.log; exit 1; }
          python scripts/public_site_runtime_diag.py --base-url "http://127.0.0.1:8765" --timeout-ms 45000
          python scripts/public_boundary_crawl.py "http://127.0.0.1:8765"
          python scripts/mobile_overflow_audit.py --base-url "http://127.0.0.1:8765" --timeout-ms 45000 --width 360 --height 800 --strict
          python scripts/mobile_overflow_audit.py --base-url "http://127.0.0.1:8765" --timeout-ms 45000 --width 390 --height 844 --strict

  deploy:
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: mlbma-pipeline-b
      PRODUCTION_BRANCH: master
      LIVE_DOMAIN: chase-analytics.com
    steps:
      - uses: actions/checkout@v4

      - name: Build clean web-only directory
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='core' --exclude='outputs' --exclude='pipeline' \
            --exclude='scripts' --exclude='tests' --exclude='__pycache__' \
            --exclude='*.py' --exclude='*.pyc' --exclude='requirements.txt' \
            --exclude='*.md' --exclude='.env*' --exclude='wrangler.jsonc' \
            --exclude='wrangler.toml' \
            --exclude='.assetsignore' --exclude='_site' \
            ./ _site/
          git rev-parse HEAD > _site/_release-revision.txt
          echo "files to publish: $(find _site -type f | wc -l)"
          test -f _site/dashboard/matchup_card.js
          grep -q 'Expand matchup' _site/dashboard/matchup_card.js
          test -f _site/dashboard/public_game_detail.js
          grep -q 'ChasePublicGameDetail' _site/dashboard/public_game_detail.js
          test -f _site/data/public/mlb/slate.json
          test -f _site/data/public/nfl/slate.json
          test -f _site/data/public/cbb/slate.json
          test -f _site/cbb/shot-charts.html
          test -f _site/functions/api/cbb-fixtures.js
          test -f _site/mlb/matchup.html
          test -f _site/nfl/matchup.html

      - name: Configure Pages for static master production deploys
        # The upload below excludes wrangler.toml/wrangler.jsonc, so Functions run on the
        # project's own compat date. It was left at 2024-09-23, where fetch({cache}) throws
        # and took Model Center down (PR #90). Pin it here so it cannot drift again.
        env:
          COMPAT_DATE: "2026-06-27"
        run: |
          RESP=$(curl -sS -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            -d "{\"production_branch\":\"$PRODUCTION_BRANCH\",\"build_config\":{\"build_command\":\"\",\"destination_dir\":\"/\",\"root_dir\":\"\"},\"source\":{\"config\":{\"deployments_enabled\":false,\"production_deployments_enabled\":false}},\"deployment_configs\":{\"production\":{\"compatibility_date\":\"$COMPAT_DATE\"},\"preview\":{\"compatibility_date\":\"$COMPAT_DATE\"}}}")
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or {}; print('production_branch:', r.get('production_branch')); bc=r.get('build_config') or {}; print('destination_dir:', bc.get('destination_dir')); cd=((r.get('deployment_configs') or {}).get('production') or {}).get('compatibility_date'); print('compatibility_date:', cd); sys.exit(0 if d.get('success') and cd == '$COMPAT_DATE' else 1)"

      - name: Upload clean build to master branch alias
        run: |
          cd _site
          npx --yes wrangler@4.40.0 pages deploy . \
            --project-name="$PAGES_PROJECT" \
            --branch="$PRODUCTION_BRANCH" \
            --commit-hash="${{ github.sha }}" \
            --commit-message="$(git -C .. log -1 --pretty=%s)" \
            --commit-dirty=true

      - name: Check whether the uploaded revision is live
        id: direct
        run: |
          EXPECTED=$(cat _site/_release-revision.txt)
          for delay in 2 3 5 8 10; do
            sleep "$delay"
            LIVE=$(curl -fsSL --max-time 10 "https://${LIVE_DOMAIN}/_release-revision.txt?run=${GITHUB_RUN_ID}&probe=$delay" || true)
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "live=true" >> "$GITHUB_OUTPUT"
              echo "Direct upload serves revision $EXPECTED"
              exit 0
            fi
          done
          echo "live=false" >> "$GITHUB_OUTPUT"

      - name: Trigger fallback production deployment from master
        id: fallback
        if: steps.direct.outputs.live != 'true'
        run: |
          python3 <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          project = os.environ["PAGES_PROJECT"]
          branch = os.environ["PRODUCTION_BRANCH"]
          sha = os.environ.get("GITHUB_SHA", "")
          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}"

          def api(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  f"{base}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  print(exc.read().decode(), file=sys.stderr)
                  raise

          payload = {"branch": branch}
          if sha:
              payload["commit_hash"] = sha
          created = api("POST", "/deployments", payload)
          if not created.get("success"):
              print(json.dumps(created, indent=2), file=sys.stderr)
              sys.exit(1)
          dep = created.get("result") or {}
          dep_id = dep.get("id")
          print("Triggered production deployment:", dep_id, dep.get("url"))

          for attempt in range(72):
              time.sleep(10)
              info = api("GET", f"/deployments/{dep_id}").get("result") or {}
              stages = info.get("stages") or []
              latest = info.get("latest_stage") or (stages[-1] if stages else {})
              status = latest.get("status")
              name = latest.get("name")
              print(f"poll {attempt + 1}: stage={name} status={status}")
              if status == "success":
                  print("Production deployment succeeded:", info.get("url"))
                  sys.exit(0)
              if status in {"failure", "canceled"}:
                  print(f"Production deployment {dep_id} failed at {name}: {status}", file=sys.stderr)
                  sys.exit(1)
          print("Timed out waiting for production deployment", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Verify chase-analytics.com serves the matchup-first release
        run: |
          URL="https://${LIVE_DOMAIN}/"
          EXPECTED=$(cat _site/_release-revision.txt)
          for i in 1 2 3 4 5 6 8 10; do
            sleep "$i"
            BODY=$(curl -fsSL --max-time 15 "$URL" || true)
            LIVE=$(curl -fsSL --max-time 10 "${URL}_release-revision.txt?run=${GITHUB_RUN_ID}&probe=final-$i" || true)
            MATCH=0
            if [ "$LIVE" = "$EXPECTED" ]; then
              MATCH=1
            elif [ "${{ steps.fallback.outcome }}" = "success" ]; then
              # A Git build does not contain the marker written in _site.
              # Verify the live public assets against the same checkout.
              MATCH=1
              for asset in dashboard/public_game_detail.js dashboard/cbb_charts.js data/public/cbb/slate.json data/public/nba/slate.json; do
                if ! curl -fsSL --max-time 10 "${URL}${asset}?run=${GITHUB_RUN_ID}" | cmp -s - "_site/${asset}"; then
                  MATCH=0
                  break
                fi
              done
            fi
            BYTES=$(printf '%s' "$BODY" | wc -c | tr -d ' ')
            HAS=$(printf '%s' "$BODY" | grep -c 'id="matchupDesk"' || true)
            PUBLIC=$(printf '%s' "$BODY" | grep -c 'chase-public.css' || true)
            echo "attempt $i: bytes=$BYTES matchupDesk=$HAS publicLayer=$PUBLIC"
            if [ "$MATCH" -eq 1 ] && [ "$BYTES" -gt 4000 ] && [ "$HAS" -ge 1 ] && [ "$PUBLIC" -ge 1 ]; then
              echo "Live public release verified for $EXPECTED"
              exit 0
            fi
          done
          echo "ERROR: chase-analytics.com still serving the previous public shell"
          exit 1
