name: Run MLBMA Pipeline

# Runs the full pipeline on a GitHub-hosted runner instead of a local machine.
# FanGraphs is always skipped here (headless Selenium bot-login is unreliable in
# CI) -- run scrape_fangraphs / scrape_batter_splits locally instead. Every other
# step is non-fatal by design (pipeline.main only hard-fails on scrape_savant), so
# a missing/expired secret degrades individual steps to SKIP/WARNING rather than
# failing the whole job.

on:
  workflow_dispatch:
    inputs:
      run_fangraphs:
        description: "Also run FanGraphs Selenium scrapers (headless bot-login is unreliable on CI)"
        type: boolean
        default: false
  schedule:
    # 11:00 UTC ~= 6-7am US/Eastern (DST-dependent), matching the routine morning run.
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: run-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # A healthy run is minutes once the Statcast cache is warm; a cold-cache backfill
    # of the whole season is ~45. Slate (lineups/matchups/weather) now publishes first
    # so a timeout cannot strand the desk on yesterday's data.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runners are ephemeral, so the on-disk Statcast cache only helps here if it is
      # restored between runs. Finished windows never change, so an older cache is
      # always safe to reuse: the key rolls monthly and restore-keys pick up the
      # newest available snapshot.
      - name: Restore Statcast window cache
        uses: actions/cache@v4
        with:
          path: data/cache/statcast
          key: statcast-${{ github.ref_name }}-${{ hashFiles('scrapers/scrape_pitch_mix.py') }}
          restore-keys: |
            statcast-${{ github.ref_name }}-${{ hashFiles('scrapers/scrape_pitch_mix.py') }}-
            statcast-${{ github.ref_name }}-
            statcast-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruct google_credentials.json from secret
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS" ]; then
            echo "WARNING: GOOGLE_CREDENTIALS secret not set -- Sheets push steps will skip." >&2
          else
            printf '%s' "$GOOGLE_CREDENTIALS" > google_credentials.json
            python -c "import json; json.load(open('google_credentials.json')); print('google_credentials.json OK')"
          fi

      - name: Run pipeline
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FANGRAPHS_EMAIL: ${{ secrets.FANGRAPHS_EMAIL }}
          FANGRAPHS_PASSWORD: ${{ secrets.FANGRAPHS_PASSWORD }}
          # Fine-grained PAT with Actions: write on Alphakiller1/mlb-model, so Step 21 can
          # cross-repo dispatch the model deploy. Empty until the secret is added -> Step 21
          # just logs a WARNING (non-fatal), same as before.
          MLB_MODEL_GITHUB_TOKEN: ${{ secrets.MLB_MODEL_GITHUB_TOKEN }}
        # Scheduled runs skip FanGraphs (Selenium bot-login unreliable on CI). A manual
        # dispatch with run_fangraphs=true attempts the full credentialed pipeline.
        run: |
          if [ "${{ inputs.run_fangraphs }}" = "true" ]; then
            echo "Running FULL pipeline (FanGraphs enabled)"
            python -u -m pipeline.main
          else
            python -u -m pipeline.main --skip-fangraphs
          fi
