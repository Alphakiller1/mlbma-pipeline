name: Publish CBB Availability
# Injury designations only, every half hour from late morning to the last
# tip (owner 2026-11-12: CBB injury reports were not updating). GitHub drops
# many scheduled runs at busy times, so the slots are dense; the evidence
# refresh in publish-cbb-slate.yml still runs on its own schedule. Both share
# one concurrency group so they never write the same file at once.
on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 15-23 * 11,12,1,2,3,4 *'
    - cron: '13,43 0-3 * 11,12,1,2,3,4 *'
permissions:
  contents: write
concurrency:
  group: publish-cbb-slate
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/publish_public_cbb_availability.py
      - run: python scripts/validate_public_fields.py
      - name: Commit CBB availability
        run: |
          git add -- data/public/cbb/availability.json data/public/cbb/availability
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh public CBB availability'
          git pull --rebase origin master
          git push origin HEAD:master
