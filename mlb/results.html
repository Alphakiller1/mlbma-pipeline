<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLB Results — Chase Analytics</title>
  <link rel="stylesheet" href="/design/chase-tokens-v1.css?v=20260909r">
  <link rel="stylesheet" href="/dashboard/styles/chase-semantic.css?v=20260909r">
  <link rel="stylesheet" href="/dashboard/styles/chase-primitives.css?v=20260909r">
  <link rel="stylesheet" href="/dashboard/styles/chase-components.css?v=20260909r">
  <link rel="stylesheet" href="/dashboard/styles/chase-patterns.css?v=20260909r">

</head>
<body data-mode="evidence" data-sport="mlb" data-ca-product="research">
<!-- Chase Analytics navigation - synced via scripts/integrate_chase_nav.py -->
<header class="chase-header" id="chaseHeader">
  <nav class="chase-nav">
    <a href="/" class="chase-logo" title="Chase Analytics — Home">
      <img class="chase-nav-logo--icon" src="/dashboard/assets/chase-icon-filled.png" alt="" width="36" height="36">
      <span class="chase-wordmark"><span>Chase</span><span class="chase-wordmark__accent">Analytics</span></span>
    </a>
    <div class="chase-nav-links">
      <span class="chase-nav-product">Matchup research</span>
      <span class="chase-nav-rule" aria-hidden="true"></span>
      <nav class="chase-sport-tabs" aria-label="Sport">
        <a href="/mlb/" class="chase-sport-tab" data-nav="mlb" data-state="live">MLB</a>
        <a href="/nfl/" class="chase-sport-tab" data-nav="nfl" data-state="live">NFL</a>
      </nav>
      <a href="/#matchupDesk" class="chase-nav-link" data-nav="matchups">Matchups</a>
      <a href="/dashboard/glossary" class="chase-nav-link" data-nav="glossary">Glossary</a>
    </div>
      <a href="/model-center/" class="ca-btn ca-btn--primary chase-nav-model chase-nav-link" data-nav="models">Model Center</a>
    <div class="chase-status">
      <div class="chase-timestamp">
        <span class="chase-pipeline-dot" id="pipelineStatus" title="Pipeline: Fresh"></span>
        <span id="lastUpdated">Syncing</span>
      </div>
      <button type="button" class="chase-hamburger" id="hamburgerBtn" aria-label="Open Menu"
        aria-controls="mobileMenu" aria-expanded="false" aria-haspopup="dialog">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
</header>
<div class="chase-mobile-overlay" id="mobileOverlay" aria-hidden="true"></div>
<div class="chase-mobile-menu" id="mobileMenu" role="dialog" aria-modal="true"
  aria-label="Main Menu" aria-hidden="true">
  <div class="chase-mobile-header">
    <a href="/" class="chase-logo" title="Chase Analytics">
      <img class="chase-nav-logo--icon" src="/dashboard/assets/chase-icon-filled.png" alt="" width="36" height="36">
      <span class="chase-wordmark"><span>Chase</span><span class="chase-wordmark__accent">Analytics</span></span>
    </a>
    <button type="button" class="chase-mobile-close" id="mobileClose" aria-label="Close Menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
  <div class="chase-mobile-brand" aria-hidden="true">
    <img class="chase-mobile-brand-icon" src="/dashboard/assets/chase-icon-filled.png" alt="" width="24" height="24">
  </div>
  <div class="chase-mobile-nav">
    <a href="/" class="chase-mobile-link" data-nav="home">Home</a>
    <a href="/#matchupDesk" class="chase-mobile-link" data-nav="matchups">Matchups</a>
    <a href="/mlb/" class="chase-mobile-link" data-nav="mlb">MLB</a>
    <a href="/nfl/" class="chase-mobile-link" data-nav="nfl">NFL</a>
    <a href="/model-center/" class="chase-mobile-link chase-mobile-link--model" data-nav="models">Model Center</a>
    <a href="/dashboard/glossary.html" class="chase-mobile-link" data-nav="glossary">Glossary</a>
  </div>
  <div class="chase-mobile-status">
    <div class="chase-timestamp">
      <span class="chase-pipeline-dot" title="Pipeline: Fresh"></span>
      <span id="mobileLastUpdated">Syncing</span>
    </div>
  </div>
</div>
  <div id="caContextBar" class="ca-context-bar" role="status"></div>
  <main class="ca-public-page ca-shell-main">
    <header class="ca-public-page__head">
      <div class="ca-public-page__copy">
        <p class="ca-public-page__eyebrow">Chase Analytics · MLB</p>
        <h1 class="ca-public-page__title">MLB Results</h1>
        <p class="ca-public-page__lede">Final scores and game status from the published slate.</p>
      </div>

    </header>
    <div class="ca-public-page__content"><div id="slate" class="ca-async" data-state="loading">Loading MLB slate…</div></div>
  </main>
  <footer class="ca-shell-footer">Chase Analytics</footer>
  <script src="/dashboard/design_layer_version.js?v=20260909r"></script>
  <script src="/dashboard/mlbma_assets.js?v=20260909r"></script>
  <script src="/dashboard/chase_datastatus.js?v=20260909r"></script>
  <script src="/dashboard/sports/public_sport_registry.js?v=20260909r"></script>
  <script src="/dashboard/sports/chase_public_slate.js?v=20260909r"></script>
  <script src="/dashboard/matchup_card.js?v=20260909r"></script>
  <script src="/dashboard/sports/mlb.js?v=20260909r"></script>
  <script src="/dashboard/chase_asyncstate.js?v=20260909r"></script>
  <script src="/dashboard/chase_nav.js?v=20260909r"></script>
  <script src="/dashboard/chase_shell.js?v=20260909r"></script>
  <script>
  window.CHASE_SPORT_PAGE = ChaseSportMLB;
  window.CHASE_SPORT_ID = "mlb";
  window.CHASE_SPORT_PICKS_LABEL = "Public slate";
  window.CHASE_SPORT_GEMS_LABEL = null;
  window.CHASE_SPORT_IS_MATCHUPS = false;
  window.CHASE_SPORT_IS_RESULTS = true;
  
(function () {
  var adapter = window.CHASE_SPORT_PAGE;
  var sport = window.CHASE_SPORT_ID;
  if (window.ChaseShell) ChaseShell.mount({ sport: sport, mode: 'evidence', surface: 'results', search: false });
  if (window.ChaseMatchupCard) ChaseMatchupCard.mount({ sport: sport, adapter: adapter, host: document.getElementById('slate'), results: true });
})();

  </script>
</body>
</html>
