<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Opening matchup — Chase Analytics</title>
  <script>
    (function () {
      var incoming = new URLSearchParams(location.search || '');
      var outgoing = new URLSearchParams();
      ['game', 'gamePk', 'away', 'home', 'date'].forEach(function (key) {
        if (incoming.has(key)) outgoing.set(key, incoming.get(key));
      });
      var suffix = outgoing.toString();
      location.replace('/mlb/matchup.html' + (suffix ? '?' + suffix : ''));
    })();
  </script>
</head>
<body>
  <p><a id="fallback" href="/mlb/">Continue to MLB matchups</a></p>
  <script>
    document.getElementById('fallback').href = '/mlb/matchup.html' + location.search;
  </script>
</body>
</html>
