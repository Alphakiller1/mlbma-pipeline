<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Render — Pitcher Intelligence</title>
<link rel="stylesheet" href="/design/chase-tokens-v1.css?v=20260908a">
<link rel="stylesheet" href="../mlbma_design_system.css?v=20260908a">
<link rel="stylesheet" href="../theme.css?v=20260908a">
<link rel="stylesheet" href="../mlbma_ui.css?v=20260908a">
<link rel="stylesheet" href="../research_lab.css?v=20260908a">
<link rel="stylesheet" href="../responsive.css?v=20260908a">
<script src="../mlbma_supabase_headers.js?v=20260612a"></script>
<script src="../mlbma_config.js?v=20260606b"></script>
<script src="../mlbma_assets.js?v=20260615b"></script>
<script src="../mlbma_icons.js?v=20260612b"></script>
<script src="../matchup_shared.js?v=20260717e"></script>
<script src="../pitcher_lab.js?v=20260619d"></script>
</head>
<body data-mode="rank" class="ca-bg-outfield">
<main class="container ca-page-shell" style="max-width:1400px;margin:0 auto;padding:20px 24px;">
  <section id="section-research-lab">
    <div id="pane-pitching">
      <div id="rlPitcherLabRoot"></div>
    </div>
  </section>
</main>
<script>
window.LIVE_DATA = window.LIVE_DATA || {
  loaded: false, error: null, oor: [], pitching: [], pals: [],
  matchups: [], lineups: [], todayGames: [], bullpenUnits: {},
  teamProfilesByTeam: {}, rhp: null, lhp: null
};
window.showResearchSubtab = function(name) {
  if (name === 'pitcher') name = 'pitching';
  if (name !== 'pitching') return;
  var pane = document.getElementById('pane-pitching');
  if (pane) {
    pane.hidden = false;
    pane.style.cssText = 'display:block!important;visibility:visible!important;';
  }
  if (window.PitcherLab && PitcherLab.mount) PitcherLab.mount('rlPitcherLabRoot');
};
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function() { window.showResearchSubtab('pitching'); });
} else {
  window.showResearchSubtab('pitching');
}
</script>
</body>
</html>
