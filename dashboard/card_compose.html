<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Chase Analytics — Composed Post</title>
<link rel="stylesheet" href="mlbma_design_system.css">
<link rel="stylesheet" href="theme.css">
<style>
  /* Composition route: brand chrome + a grid of captured dashboard artifacts.
     Every color/font here is a site token from theme.css / mlbma_design_system.css —
     the artifacts themselves are pixels captured from the real dashboard, so the
     design cannot drift from the site by construction. */
  html, body { margin: 0; overflow: hidden; }
  body.card-page {
    width: 1080px; height: 1350px;
    background:
      radial-gradient(ellipse 90% 60% at 78% -8%, rgba(124, 77, 255, 0.14), transparent 58%),
      radial-gradient(ellipse 70% 50% at 6% 102%, rgba(91, 43, 224, 0.08), transparent 60%),
      var(--bg);
    font-family: var(--sans);
    color: var(--text);
    display: flex; flex-direction: column;
    padding: 44px 48px 36px;
    box-sizing: border-box;
  }
  .cc-header { display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; }
  .cc-brand { display: flex; align-items: center; gap: 13px; }
  .cc-brand svg { height: 38px; width: auto; display: block; }
  .cc-brand-word { font-family: var(--display); font-style: italic; font-weight: 800;
    font-size: 26px; letter-spacing: 0.01em; text-transform: uppercase; line-height: 1; }
  .cc-brand-word .w1 { color: var(--text); }
  .cc-brand-word .w2 { color: var(--ca-gray-brand); }
  .cc-meta { text-align: right; color: var(--text-3); font-size: 14px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; }

  .cc-lede { flex: 0 0 auto; margin-top: 22px; }
  .cc-eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--gold);
    text-shadow: 0 0 14px rgba(240, 194, 74, 0.17); }
  .cc-title {
    font-family: var(--display); font-weight: 800; font-size: 58px; line-height: 1.04;
    text-transform: uppercase; letter-spacing: 0.01em; margin: 8px 0 0;
    background: var(--metal-silver);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .cc-sub { color: var(--text-2); font-size: 19px; font-weight: 600; line-height: 1.4;
    margin-top: 10px; max-width: 90%; }
  .cc-lede.is-tight .cc-title { font-size: 44px; }
  .cc-lede.is-tight .cc-sub { font-size: 17px; }

  /* ── artifact area ───────────────────────────────────────────────── */
  .cc-body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 18px;
    margin-top: 24px; min-height: 0; justify-content: center; align-items: center; }
  .cc-body.layout-row { flex-direction: row; align-items: center; }
  .cc-slot { display: flex; flex-direction: column; min-height: 0; min-width: 0;
    justify-content: center; width: 100%; }
  .cc-body.layout-row > .cc-slot { flex: 1 1 0; width: auto; }
  .cc-slot img { display: block; width: 100%; height: auto; object-fit: contain;
    border-radius: var(--r-lg, 14px); margin: 0 auto; }
  /* Artifacts already carry the site's own card chrome; the frame only separates
     them from the post background when they sit edge to edge. */
  .cc-slot.is-framed img { border: 1px solid var(--border-2); background: var(--card); }
  .cc-slot-cap { margin-top: 9px; font-size: 13.5px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-3); text-align: center; }
  /* Per-artifact label (e.g. the starters under a full-card banner) — centered on its
     artifact. Post-level prose lives in .cc-notes and stays left-aligned. */
  .cc-slot-note { margin-top: 7px; font-size: 15.5px; font-weight: 600; color: var(--text-2);
    line-height: 1.42; text-align: center; }
  /* Stacked artifact widths are solved in JS (fitStack) so the column exactly fills
     the available height — no overflow, no dead band. */

  .cc-notes { flex: 0 0 auto; margin-top: 16px; display: flex; flex-direction: column; gap: 7px; }
  .cc-note { font-size: 16.5px; font-weight: 500; color: var(--text-2); line-height: 1.45;
    padding-left: 15px; position: relative; }
  .cc-note::before { content: ""; position: absolute; left: 0; top: 8px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--v-light); }

  .cc-footer { flex: 0 0 auto; margin-top: 18px; padding-top: 16px;
    border-top: 1px solid var(--border-2);
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .cc-site { color: var(--v-light); font-weight: 700; font-size: 18px; letter-spacing: 0.02em; }
  .cc-disclaimer { color: var(--text-4); font-size: 12.5px; font-weight: 500; text-align: right; }

  /* ===== Size variants (runner injects CARD_SIZE; JS stamps the class) ===== */
  body.size-1080x1080 { height: 1080px; padding: 38px 44px 32px; }
  body.size-1080x1080 .cc-title { font-size: 46px; }
  body.size-1080x1080 .cc-lede { margin-top: 16px; }
  body.size-1080x1080 .cc-body { margin-top: 18px; gap: 14px; }
  body.size-1080x1080 .cc-sub { font-size: 17px; }

  body.size-1080x1920 { height: 1920px; padding: 84px 48px 72px; }
  body.size-1080x1920 .cc-title { font-size: 66px; }
  body.size-1080x1920 .cc-body { gap: 26px; }

  body.size-1600x900 { width: 1600px; height: 900px; padding: 36px 52px 32px; }
  body.size-1600x900 .cc-title { font-size: 44px; }
  body.size-1600x900 .cc-lede { margin-top: 12px; }
  body.size-1600x900 .cc-body { margin-top: 16px; }
</style>
</head>
<body class="card-page">
  <div class="cc-header">
    <div class="cc-brand">
      <svg viewBox="0 0 120 60" aria-hidden="true">
        <path d="M4,56 C30,56 34,6 60,6 C86,6 90,56 116,56 L4,56 Z" fill="var(--v-mid)"/>
        <line x1="60" y1="6" x2="60" y2="56" stroke="var(--bg)" stroke-width="2.5"/>
      </svg>
      <span class="cc-brand-word"><span class="w1">Chase</span> <span class="w2">Analytics</span></span>
    </div>
    <div class="cc-meta" id="ccMeta"></div>
  </div>

  <div class="cc-lede" id="ccLede">
    <div class="cc-eyebrow" id="ccEyebrow"></div>
    <h1 class="cc-title" id="ccTitle"></h1>
    <p class="cc-sub" id="ccSub"></p>
  </div>

  <div class="cc-body" id="ccBody"></div>
  <div class="cc-notes" id="ccNotes"></div>

  <div class="cc-footer">
    <span class="cc-site">chase-analytics.com</span>
    <span class="cc-disclaimer">Model-generated research. Not betting advice. 21+.</span>
  </div>

<script>
(function () {
  var D = window.CARD_DATA;
  if (!D) {
    document.body.innerHTML = '<p style="color:#F5F6FA;padding:40px">No CARD_DATA injected.</p>';
    return;
  }
  if (window.CARD_SIZE) document.body.classList.add('size-' + window.CARD_SIZE);

  function set(id, txt) {
    var el = document.getElementById(id);
    if (!txt) { el.style.display = 'none'; return; }
    el.textContent = txt;
  }
  set('ccMeta', D.meta || '');
  set('ccEyebrow', D.eyebrow || '');
  set('ccTitle', D.title || '');
  set('ccSub', D.sub || '');
  if (!D.title && !D.sub && !D.eyebrow) document.getElementById('ccLede').style.display = 'none';
  if (D.tight) document.getElementById('ccLede').classList.add('is-tight');

  // Artifacts: [{src, caption, note, framed}] — src is a data URI captured from
  // the live dashboard, so the artifact pixels ARE the site.
  var body = document.getElementById('ccBody');
  body.classList.add('layout-' + (D.layout || 'stack'));
  (D.artifacts || []).forEach(function (a) {
    var slot = document.createElement('div');
    slot.className = 'cc-slot' + (a.framed ? ' is-framed' : '');
    var img = document.createElement('img');
    img.src = a.src;
    slot.appendChild(img);
    if (a.caption) {
      var cap = document.createElement('div');
      cap.className = 'cc-slot-cap';
      cap.textContent = a.caption;
      slot.appendChild(cap);
    }
    if (a.note) {
      var note = document.createElement('div');
      note.className = 'cc-slot-note';
      note.textContent = a.note;
      slot.appendChild(note);
    }
    body.appendChild(slot);
  });

  var notes = document.getElementById('ccNotes');
  (D.notes || []).forEach(function (text) {
    var n = document.createElement('div');
    n.className = 'cc-note';
    n.textContent = text;
    notes.appendChild(n);
  });

  // Fit a stacked column to the exact height available: every artifact keeps its
  // captured aspect ratio and they all shrink by one shared factor, so the post is
  // full-bleed vertically without ever overflowing the footer.
  // Row layouts are WIDTH-constrained (n artifacts share one row), so nothing to solve
  // for height — but the runner still needs to know how far the artifacts were scaled
  // down to judge legibility.
  function measureRow() {
    // naturalWidth is the CAPTURE bitmap, taken at captureDpr, so the artifact's own
    // CSS width is naturalWidth / captureDpr. Comparing against the raw bitmap would
    // report half the true scale and warn about perfectly legible posts.
    var dpr = D.captureDpr || 1;
    var imgs = [].slice.call(body.querySelectorAll('img'));
    var worst = 1;
    imgs.forEach(function (img) {
      if (img.naturalWidth) {
        worst = Math.min(worst, img.clientWidth / (img.naturalWidth / dpr));
      }
    });
    window.__composeScale = Math.min(1, worst);
  }

  function fitStack() {
    if ((D.layout || 'stack') !== 'stack') { measureRow(); return; }
    var slots = [].slice.call(body.children);
    if (!slots.length) return;
    var styles = getComputedStyle(body);
    var gap = parseFloat(styles.rowGap || styles.gap) || 0;
    var chrome = slots.reduce(function (sum, s) {
      // caption/note height is fixed cost that does not scale with the image
      return sum + [].slice.call(s.children).reduce(function (n, c) {
        return n + (c.tagName === 'IMG' ? 0 : c.offsetHeight +
          parseFloat(getComputedStyle(c).marginTop || 0));
      }, 0);
    }, 0);
    var available = body.clientHeight - gap * (slots.length - 1) - chrome;
    var width = body.clientWidth;
    var natural = slots.reduce(function (sum, s) {
      var img = s.querySelector('img');
      if (!img || !img.naturalWidth) return sum;
      return sum + width * (img.naturalHeight / img.naturalWidth);
    }, 0);
    if (!natural || available <= 0) return;
    // Artifacts can only shrink: they are already at full column width, so a column
    // shorter than the canvas leaves slack rather than growing.
    var scale = Math.min(1, available / natural);
    slots.forEach(function (s) {
      var img = s.querySelector('img');
      if (img) img.style.width = (scale * 100).toFixed(3) + '%';
    });
    // Published so the runner can re-render taller when squeezed unreadable, or
    // shorter when the column leaves a dead band.
    window.__composeScale = scale;
    window.__composeSlack = Math.max(0, available - natural * scale);
  }

  // Signal readiness only once every artifact bitmap has decoded and the layout is
  // solved, so the runner never screenshots a half-painted or unfitted post.
  var imgs = [].slice.call(document.images);
  Promise.all(imgs.map(function (i) {
    return i.complete ? Promise.resolve() : new Promise(function (res) {
      i.addEventListener('load', res); i.addEventListener('error', res);
    });
  })).then(function () {
    fitStack();
    requestAnimationFrame(function () { window.__composeReady = true; });
  });
})();
</script>
</body>
</html>
