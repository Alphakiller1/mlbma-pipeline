<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Chase Analytics — Matchup Card</title>
<link rel="stylesheet" href="mlbma_design_system.css">
<link rel="stylesheet" href="theme.css">
<style>
  /* Card-route layout only. Every color/font/effect is a site token from
     theme.css / mlbma_design_system.css — nothing invented here. */
  html, body { margin: 0; overflow: hidden; }
  body.card-page {
    width: 1080px; height: 1350px;
    background:
      radial-gradient(ellipse 90% 60% at 78% -8%, rgba(124, 77, 255, 0.14), transparent 58%),
      radial-gradient(ellipse 70% 50% at 6% 102%, rgba(91, 43, 224, 0.08), transparent 60%),
      var(--bg);
    font-family: var(--sans);
    color: var(--text);
    display: flex; flex-direction: column;
    padding: 56px 64px 48px;
    box-sizing: border-box;
  }
  .cc-header { display: flex; align-items: center; justify-content: space-between; }
  .cc-brand { display: flex; align-items: center; gap: 14px; }
  .cc-brand svg { height: 44px; width: auto; display: block; }
  .cc-brand-word { font-family: var(--display); font-style: italic; font-weight: 800;
    font-size: 30px; letter-spacing: 0.01em; text-transform: uppercase; line-height: 1; }
  .cc-brand-word .w1 { color: var(--text); }
  .cc-brand-word .w2 { color: var(--ca-gray-brand); }
  .cc-meta { text-align: right; color: var(--text-3); font-size: 15px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; }
  .cc-main { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; }
  .cc-eyebrow {
    margin-top: 28px; font-size: 17px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--gold);
    text-shadow: 0 0 14px rgba(240, 194, 74, 0.17);
  }
  .cc-title {
    font-family: var(--display); font-weight: 800; font-size: 96px; line-height: 1.02;
    text-transform: uppercase; letter-spacing: 0.01em; margin: 10px 0 6px;
    background: var(--metal-silver);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .cc-sub { color: var(--text-2); font-size: 20px; font-weight: 600; }

  .cc-teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px;
    align-items: stretch; }
  .cc-team { text-align: center; padding: 40px 22px 34px; }
  .cc-team img { width: 156px; height: 156px; object-fit: contain; }
  .cc-team-abbr { font-family: var(--display); font-weight: 800; font-size: 44px;
    letter-spacing: 0.04em; margin-top: 12px; }
  .cc-osi-label { margin-top: 22px; font-size: 14px; font-weight: 700; letter-spacing: 0.14em;
    color: var(--text-3); text-transform: uppercase; }
  .cc-osi { font-family: var(--display); font-variant-numeric: tabular-nums;
    font-weight: 800; font-size: 88px; line-height: 1; margin-top: 6px; }
  .cc-tier { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 800;
    letter-spacing: 0.12em; text-transform: uppercase; border-radius: 7px; padding: 6px 12px;
    color: var(--ca-ink); }
  .cc-vs-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .cc-vs { font-family: var(--display); font-weight: 800; font-size: 30px; color: var(--text-4); }
  .cc-edge {
    background: var(--v-grad); color: #fff; border-radius: 999px;
    font-weight: 800; font-size: 19px; letter-spacing: 0.06em; padding: 14px 26px;
    box-shadow: 0 0 0 1px rgba(139, 92, 246, 0.25), 0 10px 24px -14px var(--v-glow);
    white-space: nowrap; text-transform: uppercase;
  }
  .cc-pitchers { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .cc-pitchers .ca-card { padding: 30px 28px; }
  .cc-sp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .cc-sp-name { font-family: var(--display); font-weight: 700; font-size: 27px; }
  .cc-sp-hand { color: var(--text-3); font-weight: 700; font-size: 16px; }
  .cc-sp-score-row { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; }
  .cc-sp-score { font-family: var(--display); font-variant-numeric: tabular-nums;
    font-weight: 800; font-size: 54px; line-height: 1; }
  .cc-sp-score-label { font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--text-3); text-transform: uppercase; }
  .cc-sp-stats { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .cc-sp-stats .ca-chip { font-size: 15px; padding: 8px 13px; color: var(--text-2); }
  .cc-sp-stats .ca-chip b { color: var(--text); font-weight: 700; }

  .cc-footer { margin-top: auto; padding-top: 22px; border-top: 1px solid var(--border-2);
    display: flex; justify-content: space-between; align-items: baseline; }
  .cc-site { color: var(--v-light); font-weight: 700; font-size: 19px; letter-spacing: 0.02em; }
  .cc-disclaimer { color: var(--text-4); font-size: 13px; font-weight: 500; }

  /* ===== Size variants (runner injects CARD_SIZE; JS stamps the class) ===== */
  body.size-1080x1080 { height: 1080px; padding: 44px 60px 40px; }
  body.size-1080x1080 .cc-title { font-size: 72px; }
  body.size-1080x1080 .cc-eyebrow { margin-top: 14px; }
  body.size-1080x1080 .cc-team { padding: 26px 20px 24px; }
  body.size-1080x1080 .cc-team img { width: 116px; height: 116px; }
  body.size-1080x1080 .cc-team-abbr { font-size: 34px; margin-top: 8px; }
  body.size-1080x1080 .cc-osi { font-size: 64px; }
  body.size-1080x1080 .cc-osi-label { margin-top: 12px; }
  body.size-1080x1080 .cc-pitchers .ca-card { padding: 22px 24px; }
  body.size-1080x1080 .cc-sp-score { font-size: 44px; }

  body.size-1080x1920 { height: 1920px; padding: 72px 64px 60px; }
  body.size-1080x1920 .cc-title { font-size: 104px; }
  body.size-1080x1920 .cc-team img { width: 190px; height: 190px; }
  body.size-1080x1920 .cc-osi { font-size: 104px; }
  body.size-1080x1920 .cc-team { padding: 52px 24px 44px; }
  body.size-1080x1920 .cc-sp-score { font-size: 64px; }

  body.size-1600x900 { width: 1600px; height: 900px; padding: 40px 64px 36px; }
  body.size-1600x900 .cc-eyebrow { margin-top: 8px; font-size: 15px; }
  body.size-1600x900 .cc-title { font-size: 60px; margin: 6px 0 4px; }
  body.size-1600x900 .cc-sub { font-size: 17px; }
  body.size-1600x900 .cc-main { flex-direction: row; align-items: center; gap: 36px;
    justify-content: space-between; }
  body.size-1600x900 .cc-main > div:first-child { flex: 0 0 360px; }
  body.size-1600x900 .cc-teams { flex: 1; gap: 18px; }
  body.size-1600x900 .cc-team { padding: 24px 18px 22px; }
  body.size-1600x900 .cc-team img { width: 104px; height: 104px; }
  body.size-1600x900 .cc-team-abbr { font-size: 30px; margin-top: 6px; }
  body.size-1600x900 .cc-osi { font-size: 56px; }
  body.size-1600x900 .cc-osi-label { margin-top: 10px; font-size: 12px; }
  body.size-1600x900 .cc-pitchers { flex: 0 0 400px; grid-template-columns: 1fr; gap: 14px; }
  body.size-1600x900 .cc-pitchers .ca-card { padding: 18px 22px; }
  body.size-1600x900 .cc-sp-name { font-size: 21px; }
  body.size-1600x900 .cc-sp-score { font-size: 38px; }
  body.size-1600x900 .cc-sp-score-row { margin-top: 8px; }
  body.size-1600x900 .cc-sp-stats { margin-top: 10px; }
  body.size-1600x900 .cc-sp-stats .ca-chip { font-size: 13px; padding: 6px 10px; }
  body.size-1600x900 .cc-edge { font-size: 16px; padding: 11px 20px; }
  body.size-1600x900 .cc-vs { font-size: 22px; }
</style>
</head>
<body class="card-page">
  <div class="cc-header">
    <div class="cc-brand">
      <svg viewBox="0 0 120 60" aria-hidden="true">
        <path d="M4,56 C30,56 34,6 60,6 C86,6 90,56 116,56 L4,56 Z" fill="var(--v-mid)"/>
        <line x1="60" y1="6" x2="60" y2="56" stroke="var(--bg)" stroke-width="2.5"/>
      </svg>
      <span class="cc-brand-word"><span class="w1">Chase</span> <span class="w2">Analytics</span></span>
    </div>
    <div class="cc-meta" id="ccDate"></div>
  </div>

  <div class="cc-main">
  <div>
    <div class="cc-eyebrow" id="ccEyebrow">Tonight's Matchup</div>
    <div class="cc-title" id="ccTitle"></div>
    <div class="cc-sub" id="ccSub"></div>
  </div>

  <div class="cc-teams">
    <div class="ca-card cc-team">
      <img id="awayLogo" alt="">
      <div class="cc-team-abbr" id="awayAbbr"></div>
      <div class="cc-osi-label">Offense · OSI</div>
      <div class="cc-osi" id="awayOsi"></div>
      <span class="cc-tier" id="awayTier"></span>
    </div>
    <div class="cc-vs-col">
      <div class="cc-vs">VS</div>
      <div class="cc-edge" id="ccEdge"></div>
    </div>
    <div class="ca-card cc-team">
      <img id="homeLogo" alt="">
      <div class="cc-team-abbr" id="homeAbbr"></div>
      <div class="cc-osi-label">Offense · OSI</div>
      <div class="cc-osi" id="homeOsi"></div>
      <span class="cc-tier" id="homeTier"></span>
    </div>
  </div>

  <div class="cc-pitchers">
    <div class="ca-card">
      <div class="cc-sp-head">
        <span class="cc-sp-name" id="awaySpName"></span>
        <span class="cc-sp-hand" id="awaySpHand"></span>
      </div>
      <div class="cc-sp-score-row">
        <span class="cc-sp-score" id="awaySpScore"></span>
        <span class="cc-sp-score-label">Pitching Score</span>
      </div>
      <div class="cc-sp-stats" id="awaySpStats"></div>
    </div>
    <div class="ca-card">
      <div class="cc-sp-head">
        <span class="cc-sp-name" id="homeSpName"></span>
        <span class="cc-sp-hand" id="homeSpHand"></span>
      </div>
      <div class="cc-sp-score-row">
        <span class="cc-sp-score" id="homeSpScore"></span>
        <span class="cc-sp-score-label">Pitching Score</span>
      </div>
      <div class="cc-sp-stats" id="homeSpStats"></div>
    </div>
  </div>
  </div>

  <div class="cc-footer">
    <span class="cc-site">chase-analytics.com</span>
    <span class="cc-disclaimer">Model-generated research. Not betting advice. 21+.</span>
  </div>

<script>
(function () {
  var D = window.CARD_DATA;
  if (!D) { document.body.innerHTML = '<p style="color:#F5F6FA;padding:40px">No CARD_DATA injected.</p>'; return; }
  if (window.CARD_SIZE) document.body.classList.add('size-' + window.CARD_SIZE);

  // OSI tiers per site convention: Elite 85+, High Level 75–84, Dangerous 65–74,
  // Inconsistent 50–64, Weak <50 — colored with the locked --d-* grading scale.
  function tier(v) {
    if (v >= 85) return { label: 'Elite', tok: '--d-elite' };
    if (v >= 75) return { label: 'High Level', tok: '--d-good' };
    if (v >= 65) return { label: 'Dangerous', tok: '--d-mid' };
    if (v >= 50) return { label: 'Inconsistent', tok: '--d-weak' };
    return { label: 'Weak', tok: '--d-poor' };
  }
  var css = getComputedStyle(document.documentElement);
  function tok(name) { return css.getPropertyValue(name).trim(); }
  function logoUrl(abbr) {
    return 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/mlb/500/' +
      abbr.toLowerCase() + '.png&w=256&h=256';
  }
  function set(id, txt) { document.getElementById(id).textContent = txt; }
  // Unavailable renders as an em dash, never NaN/zero (content contract rule).
  var DASH = '—';
  function fmtPct(v) {
    var n = parseFloat(v);
    return isNaN(n) ? DASH : (n * 100).toFixed(1) + '%';
  }
  function fmtNum(v, dp) {
    var n = parseFloat(v);
    return isNaN(n) ? DASH : n.toFixed(dp);
  }

  set('ccDate', D.dateLabel + ' · ' + D.time);
  set('ccTitle', D.away + ' @ ' + D.home);
  set('ccSub', D.awaySp + ' vs ' + D.homeSp + ' · First pitch ' + D.time);
  set('ccEdge', D.edge + ' Lineup Edge');

  [['away', D.away, D.awayOsi], ['home', D.home, D.homeOsi]].forEach(function (side) {
    var pfx = side[0], abbr = side[1], osi = parseFloat(side[2]);
    document.getElementById(pfx + 'Logo').src = logoUrl(abbr);
    set(pfx + 'Abbr', abbr);
    set(pfx + 'Osi', osi.toFixed(1));
    var t = tier(osi);
    document.getElementById(pfx + 'Osi').style.color = tok(t.tok);
    var chip = document.getElementById(pfx + 'Tier');
    chip.textContent = t.label;
    chip.style.background = tok(t.tok);
  });

  [['away', D.awaySp, D.awaySpHand, D.awaySpScore, D.awaySpStats],
   ['home', D.homeSp, D.homeSpHand, D.homeSpScore, D.homeSpStats]].forEach(function (row) {
    var pfx = row[0];
    set(pfx + 'SpName', row[1]);
    set(pfx + 'SpHand', row[2] + 'HP');
    var score = parseFloat(row[3]);
    var scoreEl = document.getElementById(pfx + 'SpScore');
    scoreEl.textContent = fmtNum(row[3], 1);
    if (!isNaN(score)) scoreEl.style.color = tok(tier(score).tok);
    var stats = row[4];
    document.getElementById(pfx + 'SpStats').innerHTML =
      '<span class="ca-chip">K% <b>' + fmtPct(stats.k) + '</b></span>' +
      '<span class="ca-chip">BB% <b>' + fmtPct(stats.bb) + '</b></span>' +
      '<span class="ca-chip">HR/9 <b>' + fmtNum(stats.hr9, 2) + '</b></span>' +
      '<span class="ca-chip">FIP <b>' + fmtNum(stats.fip, 2) + '</b></span>';
  });
})();
</script>
</body>
</html>
